<!-- Vendor Card Component Example -->
<div class="card vendor-card vendor-card-wrap" data-name="Vendor Name" data-category="category">
  <div class="vendor-card-header">
    <div class="vendor-avatar">🛍️</div>
    <div>
      <div class="vendor-name">Vendor Name</div>
      <div class="vendor-category">Category</div>
    </div>
    <span class="badge badge-success" style="margin-left:auto;">Active</span>
  </div>
  <div class="vendor-meta">
    <div class="vendor-meta-item">⭐ 4.8 (120 reviews)</div>
    <div class="vendor-meta-item">📍 Location</div>
  </div>
  <p style="font-size:.88rem; color:var(--text-muted);">Short description of the vendor and their services.</p>
  <div class="vendor-tags">
    <span class="vendor-tag">Tag 1</span>
    <span class="vendor-tag">Tag 2</span>
    <span class="vendor-tag">Tag 3</span>
  </div>
  <div class="vendor-footer">
    <span style="font-size:.85rem; color:var(--text-muted);">Responds in ~2h</span>
    <a href="#" class="btn btn-primary btn-sm">Contact</a>
  </div>
</div>
